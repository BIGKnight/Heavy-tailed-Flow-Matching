# nu = inf reduces t-Flow to standard Gaussian flow matching; useful as a
# sanity-check baseline that the training/sampling pipeline matches the
# Gaussian-FM numbers.
nu: .inf
epochs: 2000
batch_size: 100
lr: 0.0002
lr_gamma: 0.99
lr_step: 1000
warmup: 500
grad_clip: 5.0
ema_decay: 0.9999
ckpt_freq: 100
out_dir: ./runs/tflow_cifar10lt_gaussian
seed: null
num_workers: 2
image_size: 32
cifar_root: ./data/cifar10
cifar_split_dir: ./data/splits
param: noise
