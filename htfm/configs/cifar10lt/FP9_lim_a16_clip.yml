data:
  channels: 3
  dataset: cifar10_lt
  image_size: 32
  long_tail:
    enabled: true
    imbalance_ratio: 0.01
    max_count: 5000
    metadata_dir: ./data/splits
    num_classes: 10
    seed: 42
  num_classes: 10
  random_flip: true
dlpm:
  alpha: 1.6
  input_scaling: false
  isotropic: true
  mean_predict: EPSILON
  rescale_timesteps: true
  reverse_steps: 4000
  scale: scale_preserving
  var_predict: FIXED
eval:
  batch_size: 100
  data_to_generate: 5000
  dlpm:
    clamp_a: 20
    clamp_eps: 200
    clip_denoised: false
    deterministic: false
    dlim_eta: 0.0
    reverse_steps: 1000
  fm:
    clamp_a: 20
    clamp_eps: 200
    clip_denoised: false
    deterministic: true
    reverse_steps: 200
  lim:
    clip_denoised: true
    deterministic: false
    reverse_steps: 1000
  real_data: 5000
fm:
  alpha: 1.6
  flow_type: straight_line
  input_scaling: false
  isotropic: true
  noise_type: terminal
  prediction_type: velocity
  reverse_steps: 200
  scale: scale_preserving
lim:
  alpha: 1.6
  clamp_a: null
  clamp_eps: null
  isotropic: true
  rescale_timesteps: true
  reverse_steps: 1000
method: lim
model:
  attn_resolutions:
  - 16
  channel_mult:
  - 1
  - 2
  - 2
  - 2
  dropout: 0.0
  learn_variance: false
  model_channels: 128
  model_type: ddpm
  num_heads: 4
  num_res_blocks: 2
optim:
  lr: 0.0002
  lr_gamma: 0.99
  lr_step_size: 1000
  lr_steps: 300000
  optimizer: adamw
  schedule: steplr
  warmup: 500
path_conditioning:
  enabled: false
  injection:
    global:
      enabled: false
      mode: add_to_t
    modulation:
      enabled: false
      target_layers:
      - middle
run:
  checkpoint_freq: 100
  epochs: 2000
  eval_freq: null
  progress: false
seed: null
training:
  batch_size: 100
  dlpm:
    clamp_a: 20
    clamp_eps: 200
    ema_rates:
    - 0.9999
    grad_clip: 5.0
    loss_monte_carlo: mean
    loss_type: EPS_LOSS
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    monte_carlo_t: 1
  fm:
    clamp_a: 20
    clamp_eps: 200
    ema_rates:
    - 0.9999
    fm_loss_weighting:
      enabled: false
      mode: none
    grad_clip: 5.0
    loss_monte_carlo: mean
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    monte_carlo_t: 1
    robust_exponent: 0.5
  lim:
    clamp_a: null
    clamp_eps: null
    ema_rates:
    - 0.9999
    grad_clip: 5.0
    loss_monte_carlo: mean
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    monte_carlo_t: 1
  num_workers: 0
