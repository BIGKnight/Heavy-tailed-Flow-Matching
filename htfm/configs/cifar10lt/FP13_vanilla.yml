data:
  channels: 3
  dataset: cifar10_lt
  image_size: 32
  long_tail:
    enabled: true
    imbalance_ratio: 0.01
    max_count: 5000
    metadata_dir: ./data/splits
    num_classes: 10
    seed: 42
  num_classes: 10
  random_flip: true
dlpm:
  alpha: 2.0
  input_scaling: false
  isotropic: true
  mean_predict: EPSILON
  rescale_timesteps: true
  reverse_steps: 4000
  scale: scale_preserving
  var_predict: FIXED
eval:
  batch_size: 100
  data_to_generate: 5000
  dlpm:
    clamp_a: 20
    clamp_eps: 200
    clip_denoised: false
    deterministic: false
    dlim_eta: 0.0
    reverse_steps: 1000
  fm:
    clamp_a: 20
    clamp_eps: 200
    clip_denoised: false
    deterministic: true
    reverse_steps: 200
  lim:
    clip_denoised: false
    deterministic: false
    reverse_steps: 1000
  real_data: 5000
fm:
  # Vanilla flow matching baseline:
  #   X_1 = G ~ N(0, I), no random clock, no path features.
  # No alpha here — gaussian clock doesn't consume any tail-index parameter.
  # Builder defaults alpha to 2.0 (Gaussian limit) for the schedule / gen_a /
  # gen_eps that get built but never queried by this clock.
  clock:
    type: gaussian
  flow_type: straight_line
  input_scaling: false
  isotropic: true
  noise_type: terminal
  prediction_type: velocity
  reverse_steps: 200
  scale: scale_preserving
lim:
  alpha: 2.0
  clamp_a: null
  clamp_eps: null
  isotropic: true
  rescale_timesteps: true
  reverse_steps: 1000
method: fm
model:
  attn_resolutions:
  - 16
  channel_mult:
  - 1
  - 2
  - 2
  - 2
  dropout: 0.0
  learn_variance: false
  model_channels: 128
  model_type: ddpm
  num_heads: 4
  num_res_blocks: 2
optim:
  # FP10: 5x smaller LR vs FP9 vanilla baseline (was 2.0e-4). Combined
  # with grad_clip=1.0 (vs default 5.0) — Gaussian-clock counterpart to
  # FP10_fm_a17_lr5x_no_pc_gc1.yml so the LR↓ + tight-clip recipe can
  # be compared head-to-head between Gaussian and α-stable.
  lr: 4.0e-05
  lr_gamma: 0.99
  lr_step_size: 1000
  lr_steps: 300000
  optimizer: adamw
  schedule: steplr
  warmup: 500
path_conditioning:
  enabled: false
  injection:
    global:
      enabled: false
      mode: concat
    modulation:
      enabled: false
      target_layers:
      - middle
run:
  checkpoint_freq: 100
  epochs: 2000
  eval_freq: null
  progress: false
seed: null
training:
  batch_size: 100
  dlpm:
    clamp_a: 20
    clamp_eps: 200
    ema_rates:
    - 0.9999
    grad_clip: 5.0
    loss_monte_carlo: mean
    loss_type: EPS_LOSS
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    monte_carlo_t: 1
  fm:
    clamp_a: 20
    clamp_eps: 200
    ema_rates:
    - 0.9999
    fm_loss_weighting:
      base_weight: 1.0
      detach_norm: true
      enabled: true
      eps: 1.0e-08
      lambda_weight: 0.5
      log_interval: 500
      max_weight: 5.0
      min_weight: null
      mode: time_norm
      norm_fn: power
      norm_power: 1.0
      norm_ref: 50.0
      time_fn: power
      time_power: 2.0
    # FP10: tight grad_clip 1.0 (vs FP9 vanilla baseline 5.0). Gaussian
    # clock should rarely hit clip, so this should produce ≈ identical
    # behavior to gc=5 — useful as a control for the α-stable gc=1 runs.
    grad_clip: 1.0
    loss_monte_carlo: mean
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    monte_carlo_t: 1
    robust_exponent: 0.5
  lim:
    ema_rates:
    - 0.9999
    grad_clip: 5.0
  num_workers: 0
