seed: null

data:
  grid_spacing: 2.0
  between_minus_1_1: false
  quantile_cutoff: 1.0
  data_alpha: 1.8
  dataset: sas_grid
  isotropic: true
  n_mixture: 9
  nfeatures: 2
  dim: 2
  normalized: false
  nsamples: 32000
  std: 0.1
  theta: 2.0
  weights:
  - 0.18
  - 0.08
  - 0.14
  - 0.06
  - 0.09
  - 0.10
  - 0.16
  - 0.07
  - 0.12

method: dlpm

lim:
  alpha: 1.8
  clamp_a: null
  clamp_eps: null
  reverse_steps: 100
  isotropic: true
  rescale_timesteps: true

dlpm:
  alpha: 1.8
  reverse_steps: 100
  isotropic: true
  mean_predict: EPSILON
  rescale_timesteps: true
  var_predict: FIXED
  scale: scale_preserving
  input_scaling: false

fm:
  alpha: 1.8
  reverse_steps: 100
  isotropic: true
  scale: scale_preserving
  input_scaling: false
  prediction_type: velocity
  flow_type: straight_line
  noise_type: terminal

eval:
  data_to_generate: 24000
  batch_size: 1024
  real_data: 24000
  fm:
    deterministic: true
    reverse_steps: 50
    clip_denoised: false
    clamp_a: 20
    clamp_eps: 200
  dlpm:
    deterministic: false
    dlim_eta: 0.0
    reverse_steps: 80
    clip_denoised: false
    clamp_a: 20
    clamp_eps: 200
  lim:
    deterministic: false
    reverse_steps: 100
    clip_denoised: false

model:
  a_emb_size: 32
  a_pos_emb: false
  act: silu
  dropout_rate: 0.0
  group_norm: true
  nblocks: 4
  nunits: 64
  skip_connection: true
  time_emb_size: 32
  time_emb_type: learnable
  no_a: true
  use_a_t: false
  learn_variance: false

training:
  batch_size: 1024
  num_workers: 0
  fm:
    ema_rates:
    - 0.99
    grad_clip: null
    loss_monte_carlo: mean
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    robust_exponent: 0.5
    clamp_a: 20
    clamp_eps: 200
    fm_loss_weighting:
      enabled: false
      mode: none
  dlpm:
    ema_rates:
    - 0.99
    grad_clip: null
    loss_monte_carlo: mean
    loss_type: EPS_LOSS
    lploss: 2.0
    monte_carlo_inner: 1
    monte_carlo_outer: 1
    clamp_a: 20
    clamp_eps: 200
  lim:
    ema_rates:
    - 0.99
    grad_clip: null
    clamp_a: null
    clamp_eps: null

optim:
  optimizer: adamw
  schedule: null
  lr: 0.005
  warmup: 0
  lr_steps: 2000
  lr_step_size: 400
  lr_gamma: 0.99

path_conditioning:
  path_feature_type: "none"
  logsignature_level: 3
  path_feature_input_channels:
  - t
  - effective_T
  path_feature_normalization: null
  signature_backend: "numeric"
  path_discretization_steps: 50
  path_feature_detach: false
  proj_dim: 32
  proj_hidden_dim: 32
  proj_dropout: 0.0
  global:
    enabled: false
    mode: add_to_t
  modulation:
    enabled: false
    target_layers:
    - middle

run:
  epochs: 60
  eval_freq: null
  checkpoint_freq: null
  progress: false
